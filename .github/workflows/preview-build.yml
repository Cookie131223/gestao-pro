# Temporário: gera a versão web com dados de teste para revisão visual (removido antes do merge).
name: preview-build
on:
  push:
    branches: [visual-realista]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://sb.teste.local
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: teste
      - name: publicar dist no branch build-preview
        run: |
          mkdir -p dist/_lock && cp package-lock.json dist/_lock/
          echo '{"git":{"deploymentEnabled":false}}' > dist/vercel.json
          cd dist
          git init -q -b build-preview
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-preview
